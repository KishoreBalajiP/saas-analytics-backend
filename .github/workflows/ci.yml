# Backend CI: architecture guards and the full test suite (in-memory MongoDB).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Guards and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Current LTS and the latest release. Keep in step with the version
        # the production host runs.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci:guards
      - run: npm test
        env:
          STORAGE_BASE_DIR: ${{ runner.temp }}/test-uploads
